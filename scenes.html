<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#04070c">
  <meta name="description" content="Moonvit — интерактивная вселенная витаминов. Шесть самостоятельных космических сцен.">
  <title>Moonvit — выберите свой мир</title>
  <link rel="stylesheet" href="scenes.css">
</head>
<body>
  <header><a class="logo" href="scenes.html">moonvit<sup>®</sup></a><nav aria-label="Основная навигация"><a href="scenes.html" aria-current="page">Главная</a><a href="index.html#catalog">Коллекция</a><a href="index.html#about">О бренде</a><a href="https://moonvit.space/b2b" target="_blank" rel="noopener">Сотрудничество</a><a href="https://moonvit.space/contacts" target="_blank" rel="noopener">Контакты</a></nav><button class="select-world" id="world-toggle">Выбрать свой мир ↗</button></header>
  <main class="universe" aria-label="Коллекция планет Moonvit">
    <div class="background" id="background-a" aria-hidden="true"></div>
    <div class="background next" id="background-b" aria-hidden="true"></div>
    <div class="vignette" aria-hidden="true"></div>
    <div class="dust" aria-hidden="true"></div>
    <section class="scene-copy" id="scene-copy" aria-live="polite">
      <p class="eyebrow" id="scene-eyebrow">ВАША ВЕЧЕРНЯЯ ОРБИТА</p>
      <h1 id="planet-title">Moon</h1>
      <h2 id="planet-subtitle">Сон и расслабление</h2>
      <p class="description" id="planet-description">Маленькая пауза для себя.<br>Новая планета в вашем вечернем ритуале.</p>
      <a class="product-link" href="https://moonvit.space/catalog" target="_blank" rel="noopener">Открыть коллекцию <span>↗</span></a>
    </section>
    <div class="product-stage" id="product-stage"><div class="product-sprite" id="product-sprite" role="img" aria-label="Концептуальная упаковка Moonvit Moon"></div><div class="product-shadow" aria-hidden="true"></div></div>
    <aside class="planets" aria-label="Переключение планет">
      <button data-planet="0" class="active" aria-pressed="true">Moon<span></span></button>
      <button data-planet="1" aria-pressed="false">Saturn<span></span></button>
      <button data-planet="2" aria-pressed="false">Venus<span></span></button>
      <button data-planet="3" aria-pressed="false">Mars<span></span></button>
      <button data-planet="4" aria-pressed="false">Earth<span></span></button>
      <button data-planet="5" aria-pressed="false">Neptune<span></span></button>
    </aside>
    <div class="scene-footer"><span class="scene-count" id="scene-count">01 <span>/ 06</span></span><p>ЖЕВАТЕЛЬНЫЕ ВИТАМИНЫ · MOONVIT</p><div class="arrows"><button id="previous" aria-label="Предыдущая планета">←</button><button id="next" aria-label="Следующая планета">→</button></div></div>
    <p class="concept-note">Визуальная концепция · Упаковка сгенерирована по референсу</p>
  </main>
  <script src="scenes.js"></script>
</body>
</html>
